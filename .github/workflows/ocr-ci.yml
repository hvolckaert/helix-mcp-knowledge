name: Optional OCR acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ocr-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements/ocr-component.in"
      - "src/helix_mcp_knowledge/component_requirements.py"
      - "src/helix_mcp_knowledge/application.py"
      - "src/helix_mcp_knowledge/config.py"
      - "src/helix_mcp_knowledge/resources/requirements/**"
      - "src/helix_mcp_knowledge/ocr_*.py"
      - "src/helix_mcp_knowledge/ingestion/parsers/**"
      - "tests/ocr/**"
  pull_request:
    paths:
      - ".github/workflows/ocr-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements/ocr-component.in"
      - "src/helix_mcp_knowledge/component_requirements.py"
      - "src/helix_mcp_knowledge/application.py"
      - "src/helix_mcp_knowledge/config.py"
      - "src/helix_mcp_knowledge/resources/requirements/**"
      - "src/helix_mcp_knowledge/ocr_*.py"
      - "src/helix_mcp_knowledge/ingestion/parsers/**"
      - "tests/ocr/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ocr-acceptance:
    name: ocr-acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install server, tests, and isolated OCR dependencies
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra dev
          uv run --no-sync python -m pip install --require-hashes --requirement src/helix_mcp_knowledge/resources/requirements/ocr-component.txt
      - name: Validate scanned-PDF recognition
        run: uv run --no-sync pytest -m ocr tests/ocr
